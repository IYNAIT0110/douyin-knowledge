 seen has the same quiet bottleneck: we call a generative LLM to answer a question whose answer is a label. A support ticket arrives and we need to know which queue it belongs in. An email lands and we need to know whether it is phishing. A prompt hits the API and we need to know whether someone is trying to jailbreak it. For each of those we pay 500 milliseconds to two seconds of streaming tokens, real inference spend, and then a parser we have to maintain, because the model replied in prose. And the confidence score we asked for is theatre: the model predicted tokens that sound confident, nothing more. Bootstrap automation on top of that and you have built a control system on top of a number with no mathematical grounding. That is the gap Jev walks into, and it is a much more boring gap than \"models are getting smarter\".", "cn": "我见过的每条 AI 流水线都有同一个安静的瓶颈：我们调用生成式 LLM，去回答一个答案其实是标签的问题。来了一张工单，我们想知道它归哪个队列；来了一封邮件，我们想知道它是不是钓鱼；一个 prompt 打进 API，我们想知道对方是不是在做越狱。每一个这类场景，我们都要付 500 毫秒到 2 秒的流式生成时间、真金白银的推理成本，外加一个需要自己维护的解析器 —— 因为模型是用自然语言回答的。而我们顺手要来的 confidence 分数更是表演性质：模型只是预测了\"听起来很有把握的 token\"，仅此而已。在这种东西上面搭自动化，等于把一个控制系统建在一个没有数学基础的数上。这就是 Jev 走进来的那个缺口，而且它比\"模型越来越聪明\"无聊得多。", "tok": [["Every", ""], [" ", ""], ["AI", "ai"], [" ", ""], ["pipeline", "pipeline"], [" ", ""], ["I", ""], [" ", ""], ["have", ""], [" ", ""], ["seen", "see"], [" ", ""], ["has", ""], [" ", ""], ["the", "the"], [" ", ""], ["same", "same"], [" ", ""], ["quiet", "quiet"], [" ", ""], ["bottleneck", "bottleneck"], [":", ""], [" ", ""], ["we", ""], [" ", ""], ["call", "call"], [" ", ""], ["a", "a"], [" ", ""], ["generative", "generative"], [" ", ""], ["LLM", "llm"], [" ", ""], ["to", "to"], [" ", ""], ["answer", "answer"], [" ", ""], ["a", "a"], [" ", ""], ["question", "question"], [" ", ""], ["whose", ""], [" ", ""], ["answer", "answer"], [" ", ""], ["is", ""], [" ", ""], ["a", "a"], [" ", ""], ["label", "label"], [".", ""], [" ", ""], ["A", "a"], [" ", ""], ["support", "support"], [" ", ""], ["ticket", "ticket"],  roughly a month before launch, and in hindsight the talk reads as the product's design document. Start from the contradiction: models can now attack hard mathematics and climb every benchmark, yet in the places companies actually want automation, the human never gets removed. Customer support is his example. Let the AI look things up, summarise documents, draft a reply — fine. But let the AI decide whether the refund is approved, and everyone gets cautious. Why is the easy one harder? Because of how these models were trained. RLHF collects human preferences and pushes the model toward what humans like, which means, quite literally, we put the human into the loop during training and then wondered why we cannot take the human out at inference time. He has a story for it: someone sent ChatGPT a recording of themselves farting, called it an original piece of music, and asked for sincere feedback — and got a warm, detailed appreciation of its eerie ambient qualities.", "cn": "Diogo 在发布前一个多月的一场演讲里讲了这个论点，事后回看，那场演讲几乎就是这款产品的设计文档。他从一个矛盾出发：模型今天已经能挑战高难度数学、在各类 benchmark 上一路向上，但在企业真正想做自动化的地方，人始终没被拿掉。客服就是他的例子。让 AI 查资料、总结文档、起草回复 —— 没问题。但让 AI 决定这笔钱到底退不退，所有人立刻变得谨慎。为什么简单的事反而难？因为这些模型的训练方式。RLHF 收集人类偏好，然后把模型推向人喜欢的方向 —— 也就是说，我们在训练时字面意义上把人塞进了回路里，事后却疑惑为什么推理时把人拿不出来。他有个现成的段子：有人给 ChatGPT 发了一段自己放屁的录音，说这是原创音乐，请它真诚评价，结果得到了一段温情而详尽的赏析，称赞它带有阴森的环境音乐质感。", "tok": [["Diogo", "diogo"], [" ", ""], ["made", "make"], [" ", ""], ["this", "this"], [" ", ""], ["argument", "argument"], [" ", ""], ["in", "in"], [" ", ""], ["a", "a"], [" ", ""], ["talk", "talk"], [" ", ""], ["roughly", "rough"], [" ", ""], ["a", "a"], [" ", ""], ["month", "month"], [" ", ""], ["before", ""], [" ", ""], ["launch", "launch"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["in", "in"], [" ", ""], ["hindsight", "hindsight"], [" ", ""], ["the", "the"], [" ", ""], ["talk", "talk"], [" ", ""], ["reads", "read"], [" ", ""], ["as", "as"], [" ", ""], ["the", "the"], [" ", ""], ["product's", "product'"], [" ", ""], ["design", "design"], : [], "ex": [], "lv": null}, "how": {"w": "how", "ph": "", "defs": ["adv. 怎样"], "forms": [], "ex": [], "lv": null}, "why": {"w": "why", "ph": "", "defs": ["adv. 为什么"], "forms": [], "ex": [], "lv": null}, "all": {"w": "all", "ph": "", "defs": ["adj./pron. 全部"], "forms": [], "ex": [], "lv": null}, "any": {"w": "any", "ph": "", "defs": ["adj./pron. 任何"], "forms": [], "ex": [], "lv": null}, "more": {"w": "more", "ph": "", "defs": ["adj./adv. 更多"], "forms": [], "ex": [], "lv": null}, "most": {"w": "most", "ph": "", "defs": ["adj./adv. 最；大多数"], "forms": [], "ex": [], "lv": null}, "much": {"w": "much", "ph": "", "defs": ["adj./adv. 许多（不可数）"], "forms": [], "ex": [], "lv": null}, "should": {"w": "should", "ph": "", "defs": ["v. 应该"], "forms": [], "ex": [], "lv": null}};
const eng = {
  youdao: u => 'https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(u),
  google: u => 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(u)
};
let voices = [], stopFlag = false, audioEl = null, curRow = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 句子列表 ---------- */
let h = '', last = '';
DATA.forEach((d, i) => {
  if (d.part !== last) { last = d.part; h += '<div class="part-h">Part ' + d.part + '</div>'; }
  h += '<div class="row" data-i="' + i + '"><div class="en"><span class="num">' + (i+1) + '</span>'
     + esc(d.en) + '</div>' + (d.cn ? '<div class="cn">' + esc(d.cn) + '</div>' : '') + '</div>';
});
$('list').innerHTML = h;

/* ---------- 语音 ---------- */
function loadVoices(){
  const sel = $('voice');
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  sel.innerHTML = '<option value="">默认语音</option>'
    + voices.map((v,i) => '<option value="' + i + '">' + esc(v.name) + '</option>').join('');
  if (!voices.length){
    $('engine').value = 'youdao';
    $('status').innerHTML = '本机没有检测到英文语音包，已自动切到<b>在线·有道</b>（需要联网）。';
  } else {
    $('status').textContent = '检测到 ' + voices.length + ' 个英文语音，使用本地离线朗读。';
  }
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speakLocal(text, done){
  const u = new SpeechSynthesisUtterance(text);
  const idx = $('voice').value;
  if (idx !== '' && voices[idx]) u.voice = voices[idx];
  u.lang = 'en-US'; u.rate = parseFloat($('rate').value);
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function splitChunks(text, max){
  const first = []; let cur = '';
  text.split(/(?<=[.;:!?])\s+|(?<=,)\s+/).forEach(seg => {
    if ((cur + ' ' + seg).trim().length > max && cur){ first.push(cur.trim()); cur = seg; }
    else cur = (cur ? cur + ' ' : '') + seg;
  });
  if (cur.trim()) first.push(cur.trim());
  const res = [];
  first.forEach(c => {
    if (c.length <= max){ res.push(c); return; }
    let buf = '';
    c.split(/\s+/).forEach(w => {
      if ((buf + ' ' + w).length > max && buf){ res.push(buf); buf = w; } else buf = buf ? buf + ' ' + w : w;
    });
    if (buf) res.push(buf);
  });
  return res;
}
function speakOnline(text, done){
  const mk = eng[$('engine').value] || eng.youdao;
  const arr = splitChunks(text, 170);
  let k = 0, fail = 0;
  (function next(){
    if (stopFlag || k >= arr.length) return done();
    if (audioEl) audioEl.pause();
    audioEl = new Audio(mk(arr[k])); k++;
    audioEl.onended = next;
    audioEl.onerror = () => { if (++fail >= 2) return done(); next(); };
    audioEl.play().catch(() => next());
  })();
}
function speak(text, done){
  if ($('engine').value === 'local' && voices.length) speakLocal(text, done);
  else speakOnline(text, done);
}

/* ---------- 生词本 ---------- */
const VKEY = 'yuedu_vocab';
let vocab = [];
try { vocab = JSON.parse(localStorage.getItem(VKEY) || '[]'); } catch(e){ vocab = []; }
function renderVocab(){
  $('vocabH').textContent = '⭐ 生词本（' + vocab.length + '）';
  const ul = $('vocab');
  ul.innerHTML = '';
  vocab.forEach((w, i) => {
    const li = document.createElement('li');
    const a = document.createElement('span');
    a.className = 'vw'; a.textContent = w;
    a.onclick = () => showWord(w, w);
    const b = document.createElement('span');
    b.className = 'del'; b.textContent = '×';
    b.onclick = () => { vocab.splice(i, 1); saveVocab(); };
    li.appendChild(a); li.appendChild(b); ul.appendChild(li);
  });
}
function saveVocab(){
  localStorage.setItem(VKEY, JSON.stringify(vocab));
  renderVocab();
}
renderVocab();

/* ---------- 词面板 ---------- */
function renderSentence(i){
  curRow = i;
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if (row) row.classList.add('active');
  const d = DATA[i];
  $('sent').innerHTML = '<b>句 ' + (i+1) + '</b>（Part ' + d.part + '）· ' + esc(d.en);
  const box = $('chips');
  box.innerHTML = '';
  (d.tok || []).forEach(p => {
    const t = p[0], k = p[1];
    if (/^\s+$/.test(t)){
      const sp = document.createElement('span'); sp.innerHTML = '&nbsp;'; box.appendChild(sp); return;
    }
    if (!/^[A-Za-z]/.test(t)){
      const sp = document.createElement('span'); sp.className = 'punct'; sp.textContent = t; box.appendChild(sp); return;
    }
    const el = document.createElement('span');
    el.className = 'chip' + (k && BANK[k] ? ' dict' : '');
    el.textContent = t;
    el.onclick = () => {
      box.querySelectorAll('.chip.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      showWord(k, t);
    };
    box.appendChild(el);
  });
  $('card').innerHTML = '<div class="empty">点上面任意单词查看释义。<br>带绿色底线的词，词库已收录。</div>';
}

function showWord(key, surface){
  const e = BANK[key];
  if (!e){
    $('card').innerHTML = '<div class="hd"><span class="word">' + esc(surface || key) + '</span></div>'
      + '<div class="empty">词库暂未收录这个词。</div>';
    return;
  }
  let html = '<div class="hd"><span class="word">' + esc(e.w) + '</span>'
           + (e.ph ? '<span class="phn">/' + esc(e.ph) + '/</span>' : '')
           + (e.lv ? '<span class="badge lv">' + esc(e.lv) + '</span>' : '')
           + '<button id="speakW">🔊 朗读</button><button id="starW">⭐</button></div>';
  if (e.defs && e.defs.length)
    html += '<div class="sub">释义</div><ul class="defs">' + e.defs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (e.forms && e.forms.length)
    html += '<div class="forms">词形变化：' + esc(e.forms.join(' ｜ ')) + '</div>';
  if (e.ex && e.ex.length){
    html += '<div class="sub">真实例句（点句朗读）</div>';
    html += e.ex.map(p => '<div class="ex" data-s="' + esc(p[0]) + '">' + esc(p[0])
             + '<div class="cnx">' + esc(p[1]) + '</div></div>').join('');
  }
  $('card').innerHTML = html;
  $('speakW').onclick = () => speak(e.w, () => {});
  const sw = $('starW');
  const sync = () => {
    const on = vocab.indexOf(e.w) >= 0;
    sw.textContent = on ? '★ 已收藏' : '⭐ 收藏';
    sw.className = on ? 'on' : '';
  };
  sw.onclick = () => {
    const i = vocab.indexOf(e.w);
    if (i >= 0) vocab.splice(i, 1); else vocab.push(e.w);
    saveVocab(); sync();
  };
  sync();
  $('card').querySelectorAll('.ex').forEach(el => {
    el.onclick = () => speak(el.dataset.s, () => {});
  });
}

/* ---------- 播放控制 ---------- */
function clearHL(){ document.querySelectorAll('.row.playing').forEach(r => r.classList.remove('playing')); }
function highlight(i){
  clearHL();
  const el = document.querySelector('.row[data-i="' + i + '"]');
  if (el){ el.classList.add('playing'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function cancelAll(){
  stopFlag = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
async function playFrom(start){
  stopFlag = false;
  for (let i = start; i < DATA.length; i++){
    if (stopFlag) break;
    highlight(i); renderSentence(i);
    await new Promise(res => speak(DATA[i].en, res));
    if (stopFlag) break;
    await new Promise(res => setTimeout(res, +$('gap').value));
  }
  clearHL();
}
$('list').addEventListener('click', ev => {
  const row = ev.target.closest('.row');
  if (!row) return;
  cancelAll(); stopFlag = false;
  const i = +row.dataset.i;
  highlight(i); renderSentence(i);
  speak(DATA[i].en, () => {});
});
$('playAll').onclick = () => { cancelAll(); playFrom(0); };
$('stop').onclick = () => { cancelAll(); clearHL(); };
$('toggleCn').onclick = function(){
  document.body.classList.toggle('show-cn');
  this.classList.toggle('on');
  this.textContent = document.body.classList.contains('show-cn') ? '隐藏中文' : '显示中文';
};
$('rate').oninput = () => $('rateVal').textContent = $('rate').value + 'x';
$('gap').oninput = () => $('gapVal').textContent = ($('gap').value / 1000).toFixed(1) + 's';
$('engine').onchange = function(){
  if (this.value === 'local' && !voices.length){
    this.value = 'youdao';
    $('status').textContent = '本机没有英文语音包，无法使用本地模式。';
  } else {
    $('status').textContent = this.value === 'local'
      ? '已切换到本地离线朗读。' : '已切换到' + this.options[this.selectedIndex].text + '（需要联网）。';
  }
};
</script>
