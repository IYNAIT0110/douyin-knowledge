 ""], ["single", "single"], [" ", ""], ["day", "day"], [".", ""]]}, {"part": "A", "en": "What actually accelerates growth is rarely doing more; it is correcting faster after you err.", "cn": "真正让能力快速增长的往往不是做的更多，而是犯错之后改的更快。", "tok": [["What", "what"], [" ", ""], ["actually", "actual"], [" ", ""], ["accelerates", "accelerate"], [" ", ""], ["growth", "growth"], [" ", ""], ["is", ""], [" ", ""], ["rarely", "rare"], [" ", ""], ["doing", "do"], [" ", ""], ["more", "more"], [";", ""], [" ", ""], ["it", ""], [" ", ""], ["is", ""], [" ", ""], ["correcting", "correct"], [" ", ""], ["faster", "faster"], [" ", ""], ["after", ""], [" ", ""], ["you", ""], [" ", ""], ["err", "err"], [".", ""]]}, {"part": "A", "en": "If a person fixes one key problem every day, then thirty days in, that person and their day-one self may already look like two different people.", "cn": "一个人如果每天都能修正一个关键问题，三十天之后，他和第一天的自己可能已经像两个人了。", "tok": [["If", "if"], [" ", ""], ["a", "a"], [" ", ""], ["person", "person"], [" ", ""], ["fixes", "fix"], [" ", ""], ["one", "one"], [" ", ""], ["key", "key"], [" ", ""], ["problem", "problem"], [" ", ""], ["every", ""], [" ", ""], ["day", "day"], [",", ""], [" ", ""], ["then", "then"], [" ", ""], ["thirty", "thirty"], [" ", ""], ["days", "days"], [" ", ""], ["in", "in"], [",", ""], [" ", ""], ["that", "that"], [" ", ""], ["person", "person"], [" ", ""], ["and", "and"], [" ", ""], ["their", ""], [" ", ""], ["day-one", "day-one"], [" ", ""], ["self", "self"], [" ", ""], ["may", ""], [" ", ""], ["already", ""], [" ", ""], ["look", "look"], [" ", ""], ["like", "like"], [" ", ""], ["two", "two"], [" ", ""], ["different", "different"], [" ", ""], ["people", "people"], [".", ""]]}, {"part": "A", "en": "The ten-year gap between people rarely appears suddenly in year ten; it starts in unremarkable stretches when some keep scattering their attention and others begin to concentrate.", "cn": "人与人之间的十年差距，很少是在第十年突然出现的，它往往开始于一些很不起眼的阶段——有人继续分散注意力，有人开始集中。", "tok": [["The", "the"], [" ", " ising, stop switching targets, and point everything at one genuinely important problem. Thirty days sounds short, but a person who pushes in the same direction every day may pack more force into that month than a year of scattered effort. And because a month cannot solve everything, its value is not arrival but deflection: you may not reach the destination, yet you can completely change your orbit — and see, for the first time, how fast you can actually move when attention stops leaking.", "cn": "视频开头借了一个说法——30 天的极度专注可以拉开 10 年的差距——并且立刻承认这个数字不是公式。这份诚实恰恰让后面的内容变得可用。它真正的主张是关于密度的：拉开人与人差距的，往往不是天赋，甚至不是努力的总量，而是努力被拧得多紧。大多数人每天都很努力，但努力是以碎片形式到达的——这里回个消息，那里处理件琐事，中间刷会儿信息——以至于没有任何一件事得到过一整块不被打断的注意力。而另一些人，会在某个阶段进入一种近乎极端的专注状态：他们砍掉低价值的社交，停止切换目标，把所有东西都对准一个真正重要的问题。30 天听起来很短，但一个每天都在同一方向推进的人，这一个月里拧出来的力量，可能比一年零散的努力更大。又因为一个月解决不了所有问题，它的价值不在于抵达，而在于偏转：你未必能走到终点，但你可以彻底改变轨道——并且第一次看见，当注意力不再漏掉的时候，你到底能走多快。", "tok": [["The", "the"], [" ", ""], ["video", "video"], [" ", ""], ["opens", "open"], [" ", ""], ["with", "with"], [" ", ""], ["a", "a"], [" ", ""], ["borrowed", "borrow"], [" ", ""], ["claim", "claim"], [" ", ""], ["—", ""], [" ", ""], ["thirty", "thirty"], [" ", ""], ["days", "days"], [" ", ""], ["of", "of"], [" ", ""], ["extreme", "extreme"], [" ", ""], ["focus", "focus"], [" ", ""], ["can", ""], [" ", ""], ["open", "open"], [" ", ""], ["a", "a"], [" ", ""], ["ten-year", "ten-year"], [" ", ""], ["gap", "gap"], [" ", ""], ["—", ""], [" ", ""], ["and", "and"], [" ", ""], ["immediately", "immediate"], [" ", ""], ["admits", "admit"], [" ", ""], ["the", "the"], [" ", ""], ["number", "number"], [" ", ""], ["is", ""], [" ", ""], ["not", "not"], [" ", ""], ["a", "a"], [" ", ""], ["formula", "formula"], [".", ""], [" ", ""], ["That", "that"], [" ", ""], ["honesty", "honesty"], [" ", ""], ["is", ""], [" ", ""], ["what", "what"], [" ", ""], ["makes", "make"], [" ", ""], ["the", "the"], [" ", ""], ["rest", "rest"], [" ", ""], ["usable", "usable"], [".", ""], [" ", ""], ["The", "the"], [" ", ""], ["real", at"], [" ", ""], ["some", "some"], [" ", ""], ["stage", "stage"], [",", ""], [" ", ""], ["enter", "enter"], [" ", ""], ["a", "a"], [" ", ""], ["nearly", "near"], [" ", ""], ["extreme", "extreme"], [" ", ""], ["state", "state"], [" ", ""], ["of", "of"], [" ", ""], ["focus", "focus"], [":", ""], [" ", ""], ["they", ""], [" ", ""], ["cut", "cut"], [" ", ""], ["low-value", "low-value"], [" ", ""], ["socialising", "socialise"], [",", ""], [" ", ""], ["stop", "stop"], [" ", ""], ["switching", "switch"], [" ", ""], ["targets", "target"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["point", "point"], [" ", ""], ["everything", "everything"], [" ", ""], ["at", "at"], [" ", ""], ["one", "one"], [" ", ""], ["genuinely", "genuine"], [" ", ""], ["important", "important"], [" ", ""], ["problem", "problem"], [".", ""], [" ", ""], ["Thirty", "thirty"], [" ", ""], ["days", "days"], [" ", ""], ["sounds", "sound"], [" ", ""], ["short", "short"], [",", ""], [" ", ""], ["but", "but"], [" ", ""], ["a", "a"], [" ", ""], ["person", "person"], [" ", ""], ["who", "who"], [" ", ""], ["pushes", "push"], [" ", ""], ["in", "in"], [" ", ""], ["the", "the"], [" ", ""], ["same", "same"], [" ", ""], ["direction", "direction"], [" ", ""], ["every", ""], [" ", ""], ["day", "day"], [" ", ""], ["may", ""], [" ", ""], ["pack", "pack"], [" ", ""], ["more", "more"], [" ", ""], ["force", "force"], [" ", ""], ["into", "into"], [" ", ""], ["that", "that"], [" ", ""], ["month", "month"], [" ", ""], ["than", "than"], [" ", ""], ["a", "a"], [" ", ""], ["year", "year"], [" ", ""], ["of", "of"], [" ", ""], ["scattered", "scatter"], [" ", ""], ["effort", "effort"], [".", ""], [" ", ""], ["And", "and"], [" ", ""], ["because", "because"], [" ", ""], ["a", "a"], [" ", ""], ["month", "month"], [" ", ""], ["cannot", "cannot"], [" ", ""], ["solve", "solve"], [" ", ""], ["everything", "everything"], [",", ""], [" ", ""], ["its", ""], [" ", ""], ["value", "value"], [" ", ""], ["is", ""], [" ", ""], ["not", "not"], [" ", ""], ["arrival", "arrival"], [" ", ""], ["but", "but"], [" ", ""], ["deflection", "deflection"], [":", ""], [" ", ""], ["you", ""], [" ", ""], ["may", ""], [" ", ""], ["not", "not"], [" ", ""], ["reach", "reach"], [" ", ""], ["the", "the"], [" ", ""], ["destination", "destination"], [",", ""], [" ", ""], ["yet", ""], [" ", ""], ["you", ""], [" ", ""], ["can", ""], [" ", ""], ["completely", "complete"], [" ", ""], ["change", "change"], [" ", ""], ["your", ""], [" ", ""], ["orbit", "orbit"], [" ", ""], ["—", ""], [" ", ""], ["and", "and"], [" ", ""], ["see", "see"], [",", ""], [" ", ""], ["for", "for"], [" ", ""], ["the", "the"], [" ", ""], ["first", "first"], [" ", ""], ["time", "time"], [",", ""], [" ", ""], ["how", "how"], [" ", ""], ["fast", "fast"], [" ", ""], ["you", ""], [" ", ""], ["can", ""], [" ", ""], ["actually", "actual"], [" ", ""], ["move", "move"], [" ", ""], ["when", "when"], [" ", ""], ["attention", "attention"], [" ", ""], ["stops", "stop"], [" ", ""], ["leaking", "leak"], [".", ""]]}, {"part": "B", "en": "The most counterintuitive move in the whole argument is its refusal to glorify suffering. Hearing \"extreme focus\", most people picture staying up late, grinding, fourteen-hour days. The video flips this: truly effective focus does not squeeze the body and mind dry; it reduces wasted consumption so that limited energy lands on what deserves it most. The gap is not built by doing ten extra things in a day but by going deep on one important thing for many consecutive days. What you need is not a day of sudden madness but a rhythm you can actually sustain for thirty days — a few fixed hours of high-quality daily work outweigh a twelve-hour sprint on day one followed by total surrender on day two. The core is not pain but stability: letting the important thing move forward every single day. Strong people actively defend this. They know when to mute notifications, when to decline an unnecessary gathering, when to stop explaining their plans; and they treat sleep, exercise and rest not as wasted time but as maintenance for tomorrow's capacity to invest. Hence the single standard for a thirty-day plan: not how tired you were today, but whether the most critical advance got made. Pain is not evidence of effort, and exhaustion is not an achievement — staying clear-headed, steady and high-quality over a long run is what advanced self-discipline actually looks like.", "cn": "整个论证里最反直觉的一步，是它拒绝美化苦难。听到\"极度专注\"，多数人脑补出熬夜、硬扛、一天十四个小时。视频把这一点翻了过来：真正有效的专注不是把身体和精神榨干，而是减少无效消耗，让有限的精力落在最值得的地方。差距不是靠一天多干十件事拉开的，而是靠连续很多天把重要的一件事做深。你需要的不是某一天突然发疯，而是一种你真的维持得下去的三十天节奏——每天固定几个小时的高质量工作，胜过第一天冲十二个小时、第二天彻底放弃。核心不是痛苦而是稳定：让重要的事情每天都向前移动一点。真正厉害的人会主动保卫它。他们知道什么时候静音通知、什么时候拒绝一场不必要的聚会、什么时候停止解释自己的计划；并且把睡眠、运动和休息看作不是浪费掉的时间，而是对\"明天继续投入的能力\"的维护。于是三十天计划只剩一条最重要的标准：不是我今天有多累，而是今天最关键的推进有没有完成。痛苦不是努力的证据，疲惫也不是成就感——长期保持清醒、稳定和高质量投入，才是高级自律本来的样子。", "tok": [["The", "the"], [" ", ""], ["most", "most"], [" ", ""], ["counterintuitive", "counterintuitive"], [" ", ""], ["move", "move"], [" ", ""], ["in", "in"], [" ", ""], ["the", "the"], [" ", ""], ["whole", "whole"], [" ", ""], ["argument", "argument"], [" ", ""], ["is", ""], [" ", ""], ["its", ""], [" ", ""], ["refusal", "refusal"], [" ", ""], ["to", "to"], [" ", ""], ["glorify", "glorify"], [" ", ""], ["suffering", "suffer"], [".", ""], [" ", ""], ["Hearing", "hear"], [" ", ""], ["\"", ""], ["extreme", "extreme"], [" ", ""], ["focus", "focus"], ["\"", ""], [",", ""], [" ", ""], ["most", "most"], [" ", ""], ["people", "people"], [" ", ""], ["picture", "picture"], [" ", ""], ["staying", "stay"], [" ", ""], ["up", "up"], [" ", ""], ["late", "late"], [",", ""], [" ", ""], ["grinding", "grind"], [",", ""], [" ", ""], ["fourteen-hour", "fourteen-hour"], [" ", ""], ["days", "days"], [".", ""], [" ", ""], ["The", "the"], [" ", ""], ["video", "video"], [" ", ""], ["flips", "flip"], [" ", ""], ["this", "this"], [":", ""], [" ", ""], ["truly", "tru"], [" ", ""], ["effective", "effective"], [" ", ""], ["focus", "focus"], [" ", ""], [" leep", "sleep"], [",", ""], [" ", ""], ["exercise", "exercise"], [" ", ""], ["and", "and"], [" ", ""], ["rest", "rest"], [" ", ""], ["not", "not"], [" ", ""], ["as", "as"], [" ", ""], ["wasted", "wast"], [" ", ""], ["time", "time"], [" ", ""], ["but", "but"], [" ", ""], ["as", "as"], [" ", ""], ["maintenance", "maintenance"], [" ", ""], ["for", "for"], [" ", ""], ["tomorrow's", "tomorrow"], [" ", ""], ["capacity", "capacity"], [" ", ""], ["to", "to"], [" ", ""], ["invest", "invest"], [".", ""], [" ", ""], ["Hence", "hence"], [" ", ""], ["the", "the"], [" ", ""], ["single", "single"], [" ", ""], ["standard", "standard"], [" ", ""], ["for", "for"], [" ", ""], ["a", "a"], [" ", ""], ["thirty-day", "thirty-day"], [" ", ""], ["plan", "plan"], [":", ""], [" ", ""], ["not", "not"], [" ", ""], ["how", "how"], [" ", ""], ["tired", "tir"], [" ", ""], ["you", ""], [" ", ""], ["were", ""], [" ", ""], ["today", "today"], [",", ""], [" ", ""], ["but", "but"], [" ", ""], ["whether", ""], [" ", ""], ["the", "the"], [" ", ""], ["most", "most"], [" ", ""], ["critical", "critical"], [" ", ""], ["advance", "advance"], [" ", ""], ["got", "get"], [" ", ""], ["made", "make"], [".", ""], [" ", ""], ["Pain", "pain"], [" ", ""], ["is", ""], [" ", ""], ["not", "not"], [" ", ""], ["evidence", "evidence"], [" ", ""], ["of", "of"], [" ", ""], ["effort", "effort"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["exhaustion", "exhaustion"], [" ", ""], ["is", ""], [" ", ""], ["not", "not"], [" ", ""], ["an", "an"], [" ", ""], ["achievement", "achievement"], [" ", ""], ["—", ""], [" ", ""], ["staying", "stay"], [" ", ""], ["clear-headed", "clear-head"], [",", ""], [" ", ""], ["steady", "steady"], [" ", ""], ["and", "and"], [" ", ""], ["high-quality", "high-quality"], [" ", ""], ["over", "over"], [" ", ""], ["a", "a"], [" ", ""], ["long", "long"], [" ", ""], ["run", "run"], [" ", ""], ["is", ""], [" ", ""], ["what", "what"], [" ", ""], ["advanced", "advanc"], [" ", ""], ["self-discipline", "self-discipline"], [" ", ""], ["actually", "actual"], [" ", ""], ["looks", "look"], [" ", ""], ["like", "like"], [".", ""]]}, {"part": "B", "en": "Why does a thirty-day plan insist on chasing exactly one result? Because stalled goals are rarely a difficulty problem; they are a bandwidth problem. Want to get fit, learn a language, grow an account, level up at work, start reading, improve your social life — every item matters, so every item receives a sliver of attention, and everything stays permanently in the state of \"just getting started\". The fix is to elect one primary goal, not ten wishes: a result whose progress can be judged clearly — finishing a portfolio, mastering one core skill, clearing one stage of an exam, laying the base of a long-term project, or finally killing a problem that has been dragged around for ages. A single goal then does quiet, mechanical work for you: it filters. Once you know what these thirty days are really for, it gets easier to tell what is worth doing from what merely looks busy. And a subtle psychological bonus follows: with fewer choices, internal friction drops, because you stop re-deciding your direction every morning. Real execution is not daily enthusiasm; it is still knowing what to do on the days when the excitement is gone. Thirty days of chasing one core result looks simple, yet it gives your actions something they never had — depth.", "cn": "为什么三十天计划坚持只追一个结果？因为迟迟没有结果的目标，很少是\"太难\"的问题，而是带宽的问题。想减脂、想学语言、想做账号、想提升工作能力、想开始阅读、还想改善社交——每一件都重要，于是每一件都只分到一点点注意力，所有事情都永远停在\"正在开始\"的状态。解法是选出一个主目标，而不是十个愿望：一个可以清晰判断进展的结果——完成一个作品集、掌握一项核心技能、过掉某个考试阶段、搭好一个长期项目的地基，或者把一个拖了很久的问题真正解决掉。然后，这个唯一的目标会替你做安静的、机械的活儿：筛选。一旦你知道这三十天到底是为了什么，判断\"什么值得做\"和\"什么只是看起来很忙\"就容易多了。还有一个不易察觉的心理红利：选择变少之后，内耗反而下降，因为你不再每天早上重新决定自己该往哪走。真正的执行力不是每天满怀激情，而是在激情退场的那些天里，仍然知道自己该做什么。三十天只追一个核心结果，看起来简单，却让你的行动第一次拥有了它从未有过的东西——纵深。", "tok": [["Why", "why"], [" ", ""], ["does", ""], [" ", ""], ["a", "a"], [" ", ""], ["thirty-day", "thirty-day"], [" ", ""], ["plan", "plan"], [" ", ""], ["insist", " function loadVoices(){
  const sel = $('voice');
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  sel.innerHTML = '<option value="">默认语音</option>'
    + voices.map((v,i) => '<option value="' + i + '">' + esc(v.name) + '</option>').join('');
  if (!voices.length){
    $('engine').value = 'youdao';
    $('status').innerHTML = '本机没有检测到英文语音包，已自动切到<b>在线·有道</b>（需要联网）。';
  } else {
    $('status').textContent = '检测到 ' + voices.length + ' 个英文语音，使用本地离线朗读。';
  }
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speakLocal(text, done){
  const u = new SpeechSynthesisUtterance(text);
  const idx = $('voice').value;
  if (idx !== '' && voices[idx]) u.voice = voices[idx];
  u.lang = 'en-US'; u.rate = parseFloat($('rate').value);
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function splitChunks(text, max){
  const first = []; let cur = '';
  text.split(/(?<=[.;:!?])\s+|(?<=,)\s+/).forEach(seg => {
    if ((cur + ' ' + seg).trim().length > max && cur){ first.push(cur.trim()); cur = seg; }
    else cur = (cur ? cur + ' ' : '') + seg;
  });
  if (cur.trim()) first.push(cur.trim());
  const res = [];
  first.forEach(c => {
    if (c.length <= max){ res.push(c); return; }
    let buf = '';
    c.split(/\s+/).forEach(w => {
      if ((buf + ' ' + w).length > max && buf){ res.push(buf); buf = w; } else buf = buf ? buf + ' ' + w : w;
    });
    if (buf) res.push(buf);
  });
  return res;
}
function speakOnline(text, done){
  const mk = eng[$('engine').value] || eng.youdao;
  const arr = splitChunks(text, 170);
  let k = 0, fail = 0;
  (function next(){
    if (stopFlag || k >= arr.length) return done();
    if (audioEl) audioEl.pause();
    audioEl = new Audio(mk(arr[k])); k++;
    audioEl.onended = next;
    audioEl.onerror = () => { if (++fail >= 2) return done(); next(); };
    audioEl.play().catch(() => next());
  })();
}
function speak(text, done){
  if ($('engine').value === 'local' && voices.length) speakLocal(text, done);
  else speakOnline(text, done);
}

const VKEY = 'yuedu_vocab';

function renderVocab(){
  $('vocabH').textContent = '⭐ 生词本（' + vocab.length + '）';
  const ul = $('vocab');
  ul.innerHTML = '';
  vocab.forEach((w, i) => {
    const li = document.createElement('li');
    const a = document.createElement('span');
    a.className = 'vw'; a.textContent = w;
    a.onclick = () => showWord(w, w);
    const b = document.createElement('span');
    b.className = 'del'; b.textContent = '×';
    b.onclick = () => { vocab.splice(i, 1); saveVocab(); };
    li.appendChild(a); li.appendChild(b); ul.appendChild(li);
  });
}
function saveVocab(){
  localStorage.setItem(VKEY, JSON.stringify(vocab));
  renderVocab();
}

function renderSentence(i){
  curRow = i;
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if (row) row.classList.add('active');
  const d = DATA[i];
  $('sent').innerHTML = '<b>句 ' + (i+1) + '</b>（Part ' + d.part + '）· ' + esc(d.en);
  const box = $('chips');
  box.innerHTML = '';
  (d.tok || []).forEach(p => {
    const t = p[0], k = p[1];
    if (/^\s+$/.test(t)){
      const sp = document.createElement('span'); sp.innerHTML = '&nbsp;'; box.appendChild(sp); return;
    }
    if (!/^[A-Za-z]/.test(t)){
      const sp = document.createElement('span'); sp.className = 'punct'; sp.textContent = t; box.appendChild(sp); return;
    }
    const el = document.createElement('span');
    el.className = 'chip' + (k && BANK[k] ? ' dict' : '');
    el.textContent = t;
    el.onclick = () => {
      box.querySelectorAll('.chip.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      showWord(k, t);
    };
    box.appendChild(el);
  });
  $('card').innerHTML = '<div class="empty">点上面任意单词查看释义。<br>带绿色底线的词，词库已收录。</div>';
}

function showWord(key, surface){
  const e = BANK[key];
  if (!e){
    $('card').innerHTML = '<div class="hd"><span class="word">' + esc(surface || key) + '</span></div>'

  let html = '<div class="hd"><span class="word">' + esc(e.w) + '</span>'
           + (e.ph ? '<span class="phn">/' + esc(e.ph) + '/</span>' : '')

           + '<button id="speakW">🔊 朗读</button><button id="starW">⭐</button></div>';
  if (e.defs && e.defs.length)
    html += '<div class="sub">释义</div><ul class="defs">' + e.defs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (e.forms && e.forms.length)
    html += '<div class="forms">词形变化：' + esc(e.forms.join(' ｜ ')) + '</div>';

    html += e.ex.map(p => '<div class="ex" data-s="' + esc(p[0]) + '">' + esc(p[0])
             + '<div class="cnx">' + esc(p[1]) + '</div></div>').join('');
  }
  $('card').innerHTML = html;

  const sw = $('starW');
  const sync = () => {
    const on = vocab.indexOf(e.w) >= 0;

    sw.className = on ? 'on' : '';
  };
  sw.onclick = () => {
    const i = vocab.indexOf(e.w);
    if (i >= 0) vocab.splice(i, 1); else vocab.push(e.w);
    saveVocab(); sync();
  };
  sync();
  $('card').querySelectorAll('.ex').forEach(el => {
    el.onclick = () => speak(el.dataset.s, () => {});
  });
}

/* ---------- 播放控制 ---------- */
function clearHL(){ document.querySelectorAll('.row.playing').forEach(r => r.classList.remove('playing')); }
function highlight(i){
  clearHL();
  const el = document.querySelector('.row[data-i="' + i + '"]');
  if (el){ el.classList.add('playing'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function cancelAll(){
  stopFlag = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
async function playFrom(start){
  stopFlag = false;
  for (let i = start; i < DATA.length; i++){
    if (stopFlag) break;
    highlight(i); renderSentence(i);
    await new Promise(res => speak(DATA[i].en, res));
    if (stopFlag) break;
    await new Promise(res => setTimeout(res, +$('gap').value));
  }
  clearHL();
}
$('list').addEventListener('click', ev => {
  const row = ev.target.closest('.row');
  if (!row) return;
  cancelAll(); stopFlag = false;
  const i = +row.dataset.i;
  highlight(i); renderSentence(i);
  speak(DATA[i].en, () => {});
});
$('playAll').onclick = () => { cancelAll(); playFrom(0); };
$('stop').onclick = () => { cancelAll(); clearHL(); };
$('toggleCn').onclick = function(){
  document.body.classList.toggle('show-cn');
  this.classList.toggle('on');
  this.textContent = document.body.classList.contains('show-cn') ? '隐藏中文' : '显示中文';
};
$('rate').oninput = () => $('rateVal').textContent = $('rate').value + 'x';
$('gap').oninput = () => $('gapVal').textContent = ($('gap').value / 1000).toFixed(1) + 's';
$('engine').onchange = function(){
  if (this.value === 'local' && !voices.length){
    this.value = 'youdao';
    $('status').textContent = '本机没有英文语音包，无法使用本地模式。';
  } else {
    $('status').textContent = this.value === 'local'
      ? '已切换到本地离线朗读。' : '已切换到' + this.options[this.selectedIndex].text + '（需要联网）。';
  }
};
</script>
