[".", ""]]}, {"part": "A", "en": "In other words: are you still pouring old wine into new bottles, still thinking the old way?", "cn": "也就是说，你还是新瓶装旧酒，还是老的思维？", "tok": [["In", "in"], [" ", ""], ["other", "other"], [" ", ""], ["words", "word"], [":", ""], [" ", ""], ["are", ""], [" ", ""], ["you", ""], [" ", ""], ["still", "still"], [" ", ""], ["pouring", "pour"], [" ", ""], ["old", "old"], [" ", ""], ["wine", "wine"], [" ", ""], ["into", "into"], [" ", ""], ["new", "new"], [" ", ""], ["bottles", "bottle"], [",", ""], [" ", ""], ["still", "still"], [" ", ""], ["thinking", "think"], [" ", ""], ["the", "the"], [" ", ""], ["old", "old"], [" ", ""], ["way", "way"], ["?", ""]]}, {"part": "A", "en": "Or are you ready to drop every assumption and simply ask what service a human being actually needs under these new conditions?", "cn": "还是说你要抛弃掉所有的成见，就是去单纯地设想一下：在技术已经充分的新的条件下，人应该需要什么样的服务。", "tok": [["Or", "or"], [" ", ""], ["are", ""], [" ", ""], ["you", ""], [" ", ""], ["ready", "ready"], [" ", ""], ["to", "to"], [" ", ""], ["drop", "drop"], [" ", ""], ["every", ""], [" ", ""], ["assumption", "assumption"], [" ", ""], ["and", "and"], [" ", ""], ["simply", "simp"], [" ", ""], ["ask", "ask"], [" ", ""], ["what", "what"], [" ", ""], ["service", "service"], [" ", ""], ["a", "a"], [" ", ""], ["human", "human"], [" ", ""], ["being", ""], [" ", ""], ["actually", "actual"], [" ", ""], ["needs", "need"], [" ", ""], ["under", ""], [" ", ""], ["these", "these"], [" ", ""], ["new", "new"], [" ", ""], ["conditions", "condition"], ["?", ""]]}, {"part": "A", "en": "The difference between those two is enormous.", "cn": "这个区别可是巨大。", "tok": [["The", "the"], [" ", ""], ["difference", "difference"], [" ", ""], ["between", ""], [" ", ""], ["those", "those"], [" ", ""], ["two", "two"], [" ", ""], ["is", ""], [" ", ""], ["enormous", "enormous"], [".", ""]]}, {"part": "A", "en": "So the point we keep making stands: do not use new technology to keep your old service on life support.", "cn": "所以还是我们强调的：不是拿技术为你的老服务续命。", "tok": [["So", "so"], [" ", ""], ["the", "the"], [" ", ""], ["point", "point"], [" ", ""], ["we", ""], [" ", ""], ["keep", "keep"], [" ", ""], ["making", "mak"], [" ", ""], ["stands", "stand"], [":", ""], [" ", ""], ["do", ""], [" ", ""], ["not", "not"], [" ", ""], ["use", "use"], [" ", ""], ["new", "new"], [" ", ""], ["technology", "technology"], [" ", ""], ["to", "to"], [" ", ""], ["keep", "keep"], [" ", ""], ["your", ""], [" ", ""], ["old", "old"], [" ", ""], ["service", "service"], [" ", ""], ["on", "on"], [" ", ""], ["life", "life"], [" ", ""], ["support", "support"], [".", ""]]}, {"part": "A", "en": "Set aside everything you already know, and think about how to serve each person better once the new technology is in play.", "cn": "是抛开所有的旧有的知识去思考：当我们用新技术的时候，如何更好地服务于每个人。", "tok": [["Set", "set"], [" ", ""], ["aside", "aside"], [" ", ""], ["everything", "everything"], [" ", ""], ["you", ""], [" ", ""], ["already", ""], [" ", ""], ["know", "know"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["think", "think"], [" ", ""], ["about", "about"], [" ", ""], ["how", "how"], [" ", ""], ["to", "to"], [" ", ""], ["serve", "serve"], [" ", ""], ["each", ""], [" ", ""], ["person", "person"], [" ", ""], ["better", "good"], [" ", ""], ["once", ""], [" ", ""], ["the", "the"], [" ", ""], ["new", "new"], [" ", ""], ["technology", "technology"], [" ", ""], ["is", ""], [" ", ""], ["in", "in"], [" ", ""], ["play", "play"], [".", ""]]}, {"part": "B", "en": "There is a habit of treating digital migration as one trend among many, which is exactly how people miss what is unusual about it. A trend you can join late is a trend where waiting costs you time. A one-way door is different: waiting costs you the position itself, and there is no later in which to make it up. The argument for irreversibility here is almost embarrassingly simple. Nobody who has moved online announces that they are done with the internet; a handful manage it, and the species does not. So the migration completes once, in one direction, and the ordering inside it is what matters — whoever moves first ends up holding the view from above, and everyone else arrives into a world already arranged around them. That gives you a rule you can actually apply to your own week. Separate the things you are putting off into two piles: things that are recoverable later, and things that can only be done once. Then do the second pile first, even when the first pile looks more urgent. Reorganisation, refactoring, redesign — all recoverable, because the raw material is still sitting there. Migration, capture, showing up early — not recoverable, and precisely the ones that feel skippable.", "cn": "人们习惯把数字化迁移当成众多趋势中的一个，而恰恰是这种看法让人错过了它真正不寻常的地方。一个可以晚加入的趋势，等待的代价只是时间；一扇单向门则不同 —— 等待的代价是那个位置本身，而且不存在\"以后再补上\"这回事。这里关于不可逆性的论证简单得近乎直白：没有一个已经转到线上的人会宣布自己从此不再用线上；极少数人做得到，人类这个物种做不到。所以这场迁移只发生一次、只有一个方向，而真正重要的是迁移内部的先后次序 —— 先转的人最终拿到了俯视的视角，其他所有人抵达时，世界已经围绕他们安排好了。这就给了你一条真正能用在自己这一周上的规则：把你正在拖延的事情分成两堆 —— 以后还能补的，和只能做一次的；然后先做第二堆，哪怕第一堆看起来更紧急。重组、重构、重新设计 —— 全都可挽回，因为原始材料还好好地躺在那儿。迁移、记录、早到场 —— 不可挽回，而偏偏就是这几件最容易让人觉得\"可以往后放\"。", "tok": [["There", "there"], [" ", ""], ["is", ""], [" ", ""], ["a", "a"], [" ", ""], ["habit", "habit"], [" ", ""], ["of", "of"], [" ", ""], ["treating", "treat"], [" ", ""], ["digital", "digital"], [" ", ""], ["migration", "migration"], [" ", ""], ["as", "as"], [" ", ""], ["one", "one"], [" ", ""], ["trend", "trend"], [" ", ""], ["among", ""], [" ", ""], ["many", "many"], [",", ""], [" ", ""], ["which", "which"], [" ", ""], ["is", ""], [" ", ""], ["exactly", "exact"], [" ", ""], ["how", "how"], [" ", ""], ["people", "people"], [" ", ""], ["miss", "miss"], [" ", ""], ["what", "what"], [" ", ""], ["is", ""], [" ", ""], ["unusual", "unusual"], [" ", ""], ["about", "about"], [" ", ""], ["it", ""], [".", ""], [" ", ""], ["A", "a"], [" ", ""], ["trend", "trend"], [" ", ""], ["you", ""], [" ", ""], ["can", ""], [" ", ""], ["join", "join"], [" ", ""], ["late", "late"], [" ", ""], ["is", ""], [" ",  social circle. It also quietly forces people to want things they do not want, which is the part everyone notices and nobody fixes. If the answer is the demand itself — a place where needs are posted, a heartbeat that checks it, and a mechanism that merges matching needs into one block — then you have built something that spends nothing, scales to the whole network, and never asks anybody to pretend. The second version was not possible before, and not because nobody thought of it. It needed an actor that could post, check, and combine on your behalf without you being present, and that actor arrived recently. So the reusable move is this: find the places in your product where a user is currently being asked to recruit other users, and ask whether a machine could do the recruiting instead.", "cn": "高压锅这个例子值得从视频里带走，因为它其实跟高压锅没关系。它是一道检验题，可以套用在任何\"必须凑够一堆人才成立\"的功能上。看看你的产品是怎么聚拢需求的，然后问一个问题：真正在做协调的是什么？如果答案是社交关系 —— 邀请好友、分享到群里、凑够三个人 —— 那你做出来的东西每跑一次就消耗一次人情，而且它的上限就是一个人社交圈的大小。它还会悄悄逼着人去要一些自己根本不想要的东西，这一点所有人都感觉到了，却没人修。如果答案是需求本身 —— 有一个地方可以贴需求、有一个心跳定期去查、有一套机制把同类需求并成一块 —— 那你做出来的东西不消耗任何东西、可以放大到全网、而且从不需要任何人装样子。第二个版本以前做不成，原因不是没人想到过：它需要一个能替你发帖、替你查看、替你合并、而你不必在场的角色，而这个角色是最近才到的。所以可复用的动作是这样：找出你的产品里那些\"正在要求用户去拉别的用户\"的地方，然后问一句 —— 这件事能不能交给机器去做。", "tok": [["The", "the"], [" ", ""], ["pressure", "pressure"], [" ", ""], ["cooker", "cooker"], [" ", ""], ["example", "example"], [" ", ""], ["is", ""], [" ", ""], ["worth", "worth"], [" ", ""], ["carrying", "carry"], [" ", ""], ["out", "out"], [" ", ""], ["of", "of"], [" ", ""], ["the", "the"], [" ", ""], ["video", "video"], [",", ""], [" ", ""], ["because", "because"], [" ", ""], ["it", ""], [" ", ""], ["is", ""], [" ", ""], ["not", "not"], [" ", ""], ["really", "real"], [" ", ""], ["about", "about"], [" ", ""], ["cookers", "cooker"], [".", ""], [" ", ""], ["It", ""], [" ", ""], ["is", ""], [" ", ""], ["a", "a"], [" ", ""], ["test", "test"], [" ", ""], ["for", "for"], [" ", ""], ["any", "any"], [" ", ""], ["feature", "feature"], [" ", ""], ["that", "that function loadVoices(){
  const sel = $('voice');
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  sel.innerHTML = '<option value="">默认语音</option>'
    + voices.map((v,i) => '<option value="' + i + '">' + esc(v.name) + '</option>').join('');
  if (!voices.length){
    $('engine').value = 'youdao';
    $('status').innerHTML = '本机没有检测到英文语音包，已自动切到<b>在线·有道</b>（需要联网）。';
  } else {
    $('status').textContent = '检测到 ' + voices.length + ' 个英文语音，使用本地离线朗读。';
  }
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speakLocal(text, done){
  const u = new SpeechSynthesisUtterance(text);
  const idx = $('voice').value;
  if (idx !== '' && voices[idx]) u.voice = voices[idx];
  u.lang = 'en-US'; u.rate = parseFloat($('rate').value);
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function splitChunks(text, max){
  const first = []; let cur = '';
  text.split(/(?<=[.;:!?])\s+|(?<=,)\s+/).forEach(seg => {
    if ((cur + ' ' + seg).trim().length > max && cur){ first.push(cur.trim()); cur = seg; }
    else cur = (cur ? cur + ' ' : '') + seg;
  });
  if (cur.trim()) first.push(cur.trim());
  const res = [];
  first.forEach(c => {
    if (c.length <= max){ res.push(c); return; }
    let buf = '';
    c.split(/\s+/).forEach(w => {
      if ((buf + ' ' + w).length > max && buf){ res.push(buf); buf = w; } else buf = buf ? buf + ' ' + w : w;
    });
    if (buf) res.push(buf);
  });
  return res;
}
function speakOnline(text, done){
  const mk = eng[$('engine').value] || eng.youdao;
  const arr = splitChunks(text, 170);
  let k = 0, fail = 0;
  (function next(){
    if (stopFlag || k >= arr.length) return done();
    if (audioEl) audioEl.pause();
    audioEl = new Audio(mk(arr[k])); k++;
    audioEl.onended = next;
    audioEl.onerror = () => { if (++fail >= 2) return done(); next(); };
    audioEl.play().catch(() => next());
  })();
}
function speak(text, done){
  if ($('engine').value === 'local' && voices.length) speakLocal(text, done);
  else speakOnline(text, done);
}

const VKEY = 'yuedu_vocab';
let vocab = [];
try { vocab = JSON.parse(localStorage.getItem(VKEY) || '[]'); } catch(e){ vocab = []; }
function renderVocab(){
  $('vocabH').textContent = '⭐ 生词本（' + vocab.length + '）';
  const ul = $('vocab');
  ul.innerHTML = '';
  vocab.forEach((w, i) => {
    const li = document.createElement('li');
    const a = document.createElement('span');
    a.className = 'vw'; a.textContent = w;
    a.onclick = () => showWord(w, w);
    const b = document.createElement('span');
    b.className = 'del'; b.textContent = '×';
    b.onclick = () => { vocab.splice(i, 1); saveVocab(); };
    li.appendChild(a); li.appendChild(b); ul.appendChild(li);
  });
}
function saveVocab(){
  localStorage.setItem(VKEY, JSON.stringify(vocab));
  renderVocab();
}
renderVocab();

/* ---------- 词面板 ---------- */
function renderSentence(i){
  curRow = i;
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if (row) row.classList.add('active');
  const d = DATA[i];
  $('sent').innerHTML = '<b>句 ' + (i+1) + '</b>（Part ' + d.part + '）· ' + esc(d.en);
  const box = $('chips');
  box.innerHTML = '';
  (d.tok || []).forEach(p => {
    const t = p[0], k = p[1];
    if (/^\s+$/.test(t)){
      const sp = document.createElement('span'); sp.innerHTML = '&nbsp;'; box.appendChild(sp); return;
    }
    if (!/^[A-Za-z]/.test(t)){
      const sp = document.createElement('span'); sp.className = 'punct'; sp.textContent = t; box.appendChild(sp); return;
    }
    const el = document.createElement('span');
    el.className = 'chip' + (k && BANK[k] ? ' dict' : '');
    el.textContent = t;
    el.onclick = () => {
      box.querySelectorAll('.chip.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      showWord(k, t);
    };
    box.appendChild(el);
  });
  $('card').innerHTML = '<div class="empty">点上面任意单词查看释义。<br>带绿色底线的词，词库已收录。</div>';
}

function showWord(key, surface){
  const e = BANK[key];
  if (!e){
    $('card').innerHTML = '<div class="hd"><span class="word">' + esc(surface || key) + '</span></div>'
      + '<div class="empty">词库暂未收录这个词。</div>';
    return;
  }
  let html = '<div class="hd"><span class="word">' + esc(e.w) + '</span>'
           + (e.ph ? '<span class="phn">/' + esc(e.ph) + '/</span>' : '')
           + (e.lv ? '<span class="badge lv">' + esc(e.lv) + '</span>' : '')
           + '<button id="speakW">🔊 朗读</button><button id="starW">⭐</button></div>';
  if (e.defs && e.defs.length)
    html += '<div class="sub">释义</div><ul class="defs">' + e.defs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (e.forms && e.forms.length)
    html += '<div class="forms">词形变化：' + esc(e.forms.join(' ｜ ')) + '</div>';
  if (e.ex && e.ex.length){
    html += '<div class="sub">真实例句（点句朗读）</div>';
    html += e.ex.map(p => '<div class="ex" data-s="' + esc(p[0]) + '">' + esc(p[0])
             + '<div class="cnx">' + esc(p[1]) + '</div></div>').join('');
  }
  $('card').innerHTML = html;
  $('speakW').onclick = () => speak(e.w, () => {});
  const sw = $('starW');
  const sync = () => {
    const on = vocab.indexOf(e.w) >= 0;
    sw.textContent = on ? '★ 已收藏' : '⭐ 收藏';
    sw.className = on ? 'on' : '';
  };
  sw.onclick = () => {
    const i = vocab.indexOf(e.w);
    if (i >= 0) vocab.splice(i, 1); else vocab.push(e.w);
    saveVocab(); sync();
  };
  sync();
  $('card').querySelectorAll('.ex').forEach(el => {
    el.onclick = () => speak(el.dataset.s, () => {});
  });
}

function highlight(i){

  if (el){ el.classList.add('playing'); el.scrollIntoView({block:'center', behavior:'smooth'}); }

function cancelAll(){
  stopFlag = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
async function playFrom(start){
  stopFlag = false;
  for (let i = start; i < DATA.length; i++){
    if (stopFlag) break;
    highlight(i); renderSentence(i);
    await new Promise(res => speak(DATA[i].en, res));
    if (stopFlag) break;
    await new Promise(res => setTimeout(res, +$('gap').value));
  }
  clearHL();
}
$('list').addEventListener('click', ev => {
  const row = ev.target.closest('.row');
  if (!row) return;
  cancelAll(); stopFlag = false;
  const i = +row.dataset.i;
  highlight(i); renderSentence(i);
  speak(DATA[i].en, () => {});
});
$('playAll').onclick = () => { cancelAll(); playFrom(0); };
$('stop').onclick = () => { cancelAll(); clearHL(); };

    $('status').textContent = '本机没有英文语音包，无法使用本地模式。';
  } else {
    $('status').textContent = this.value === 'local'
      ? '已切换到本地离线朗读。' : '已切换到' + this.options[this.selectedIndex].text + '（需要联网）。';
  }
};
</script>
</body>
</html>
