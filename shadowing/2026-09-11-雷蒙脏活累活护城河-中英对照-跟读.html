o these things, but that they would be paying for them again on every call, while you already paid once, up front.", "cn": "把这件事叫\"数据清洗\"严重低估了它，而这也正是很多团队跳过它的原因。清洗听起来就是去掉乱码、去重 —— 必要、无聊，而且没法拿来做出差异。但你去看这条管线真正在决定什么，就会发现它是一连串产品判断，不是保洁工作。它决定一次查询召回哪十个块，而这决定了你的检索能不能打赢通用网络搜索。它决定一句话是事实还是某人的看法，而这决定了这句话是直接进结论，还是进一堆需要交叉验证的东西。它决定一个事件是 critical 还是无关紧要，而这决定了下游到底要不要启动。每一个都是判断，而判断的质量取决于你做了多久。这才是真正的护城河：不是竞争对手做不到这些事，而是他们要在每一次调用上重新付一遍钱，而你已经一次性付完了。", "tok": [["Calling", "cal"], [" ", ""], ["it", ""], [" ", ""], ["data", "data"], [" ", ""], ["cleaning", "clean"], [" ", ""], ["undersells", "undersell"], [" ", ""], ["it", ""], [" ", ""], ["badly", "bad"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["that", "that"], [" ", ""], ["is", ""], [" ", ""], ["why", "why"], [" ", ""], ["so", "so"], [" ", ""], ["many", "many"], [" ", ""], ["teams", "team"], [" ", ""], ["skip", "skip"], [" ", ""], ["it", ""], [".", ""], [" ", ""], ["Cleaning", "clean"], [" ", ""], ["sounds", "sound"], [" ", ""], ["like", "like"], [" ", ""], ["removing", "remove"], [" ", ""], ["mojibake", "mojibake"], [" ", ""], ["and", "and"], [" ", ""], ["deduplicating", "deduplicate"], [" ", ""], ["rows", "rows"], [" ", ""], ["—", ""], [" ", ""], ["necessary", "necessary"], [",", ""], [" ", ""], ["boring", "bor"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["impossible", "impossible"], [" ", ""], ["to", "to"], [" ", ""], ["differentiate", "differentiate"], [" ", ""], ["on", "on"], [".", ""], [" ", ""], ["But", "but"], [" ", ""], ["look", "look"], [" ", ""], ["at", "at"], [" ", ""], ["what", "what"], [" ", ""], ["the", "the"], [" ", ""], ["pipeline", "pipeline"], [" ", ""], ["is", ""], [" ", ""], ["actually", "actual"], [" ", ""], ["deciding", "decid"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["it", ""], [" ", ""], ["turns", "turn"], [" ", ""], ["out", "out"], [" ", ""], ["to", "to"], [" ", ""], ["be", ""], [" ", ""], ["a", "a"], [" ", ""], ["chain", "chain"], [" ", ""], ["of", "of"], [" ", ""], ["product", "produ s are decent at it and it saves you building the pipeline. That trade looks fine on a demo and gets expensive in production, for two reasons. The first is cost: a judgement you make once when ingesting a document is paid for once, while a judgement made at query time is paid for on every query, forever, by every user. The second is stability: if the classification happens live, it can come out differently on Monday and on Tuesday, and any downstream logic that assumed a stable split now has to tolerate that wobble. There is also a subtle third cost that is easy to miss. When facts and opinions sit in the same field, your retrieval treats them as interchangeable, so a query for a number can return somebody's view of that number, and the model will report it with the same confidence. Separating them is not a tidiness preference; it is what makes the two downstream paths possible at all.", "cn": "把\"事实还是观点\"这个问题留给模型在推理时判断，是很诱人的 —— 现代模型在这件事上做得还行，而且你能省掉搭管线的功夫。这笔买卖在 demo 上看着不错，上了生产就很贵，原因有两个。第一个是成本：你在摄入文档时做一次判断，就只付一次钱；而在查询时做的判断，每一次查询、每一个用户、永远都要付。第二个是稳定性：如果分类是实时发生的，它周一和周二可能给出不同结果，而任何假定这个分流是稳定的下游逻辑，现在都得容忍这种抖动。还有第三个容易漏掉的隐性成本：当事实和观点躺在同一个字段里，你的检索会把它们当成可以互换的东西，于是查一个数值的 query 可能召回到某人对这个数值的看法，而模型会用同样的自信把它报出来。把它们分开不是洁癖，它是那两条下游路径能够存在的前提。", "tok": [["It", ""], [" ", ""], ["is", ""], [" ", ""], ["tempting", "tempt"], [" ", ""], ["to", "to"], [" ", ""], ["leave", "leave"], [" ", ""], ["the", "the"], [" ", ""], ["fact-versus-opinion", "fact-versus-opinion"], [" ", ""], ["question", "question"], [" ", ""], ["to", "to"], [" ", ""], ["the", "the"], [" ", ""], ["model", "model"], [" ", ""], ["at", "at"], [" ", ""], ["inference", "inference"], [" ", ""], ["time", "time"], [",", ""], [" ", ""], ["because", "because"], [" ", ""], ["modern", "modern"], [" ", ""], ["models", "model"], [" ", ""], ["are", ""], [" ", ""], ["decent", "decent"], [" ", ""], ["at", "at"], [" ", ""], ["it", ""], [" ", ""], ["and", "and"], [" ", ""], ["it", ""], [" ", ""], ["saves", "saf"], [" ", ""], ["you", ""], [" ", nd it works on far more than inference speed. First: what is the time scale of this task — minutes, hours, or days? Second: is anyone actually waiting for the output, and would they notice the difference? Third: when you improve it, are you saving money or saving somebody's waiting? Answer those in order and the priority usually settles itself. Saving waiting is worth a lot when a human is present and worth almost nothing when nobody checks until morning. Saving money is always worth something, but it is a steady, unglamorous return, and it rarely justifies the heroic effort people pour into latency. The reason this is worth writing down is that most engineering arguments about speed are actually two people holding different answers to question one while shouting about question three.", "cn": "可复用的版本就是三个问题，而且它的适用范围远不止推理速度。第一：这个任务的时间尺度是什么 —— 分钟、小时、还是天？第二：真的有人在等这个输出吗，他们能察觉到差别吗？第三：你改进它的时候，省下的是钱，还是某个人的等待？按顺序回答完，优先级通常会自己定下来。当有人在现场时，\"省下等待\"很值钱；当大家要到早上才看一眼时，它几乎一文不值。\"省钱\"永远有点价值，但那是一种平稳、不性感的回报，它很少能证明人们为延迟付出的那种英雄式努力是值得的。值得把这条记下来的理由是：大多数关于速度的工程争论，其实是两个人对第一个问题持有不同答案，却在为第三个问题吵架。", "tok": [["Here", "here"], [" ", ""], ["is", ""], [" ", ""], ["the", "the"], [" ", ""], ["reusable", "reusable"], [" ", ""], ["version", "version"], [",", ""], [" ", ""], ["in", "in"], [" ", ""], ["three", "three"], [" ", ""], ["questions", "question"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["it", ""], [" ", ""], ["works", "work"], [" ", ""], ["on", "on"], [" ", ""], ["far", "far"], [" ", ""], ["more", "more"], [" ", ""], ["than", "than"], [" ", ""], ["inference", "inference"], [" ", ""], ["speed", "spe"], [".", ""], [" ", ""], ["First", "first"], [":", ""], [" ", ""], ["what", "what"], [" ", ""], ["is", ""], [" ", ""], ["the", "the"], [" ", ""], ["time", "time"], [" ", ""], ["scale", "scale"], [" ", ""], ["of", "of"], [" ", ""], ["this", "this"], [" ", ""], ["task", "task"], [" ", ""], ["—", ""], [" ", ""], ["minutes", "minute"], [",", ""], [" ", ""], ["hours", "hour"], [",", ""], [" ", "" "much": {"w": "much", "ph": "", "defs": ["adj./adv. 许多（不可数）"], "forms": [], "ex": [], "lv": null}, "will": {"w": "will", "ph": "", "defs": ["v./n. 将要；意志"], "forms": [], "ex": [], "lv": null}, "would": {"w": "would", "ph": "", "defs": ["v. 会（will 过去式/委婉）"], "forms": [], "ex": [], "lv": null}, "could": {"w": "could", "ph": "", "defs": ["v. 能够（can 过去式/委婉）"], "forms": [], "ex": [], "lv": null}};
const eng = {
  youdao: u => 'https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(u),
  google: u => 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(u)
};
let voices = [], stopFlag = false, audioEl = null, curRow = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 句子列表 ---------- */
let h = '', last = '';
DATA.forEach((d, i) => {
  if (d.part !== last) { last = d.part; h += '<div class="part-h">Part ' + d.part + '</div>'; }
  h += '<div class="row" data-i="' + i + '"><div class="en"><span class="num">' + (i+1) + '</span>'
     + esc(d.en) + '</div>' + (d.cn ? '<div class="cn">' + esc(d.cn) + '</div>' : '') + '</div>';
});
$('list').innerHTML = h;

/* ---------- 语音 ---------- */
function loadVoices(){
  const sel = $('voice');
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  sel.innerHTML = '<option value="">默认语音</option>'
    + voices.map((v,i) => '<option value="' + i + '">' + esc(v.name) + '</option>').join('');
  if (!voices.length){
    $('engine').value = 'youdao';
    $('status').innerHTML = '本机没有检测到英文语音包，已自动切到<b>在线·有道</b>（需要联网）。';
  } else {
    $('status').textContent = '检测到 ' + voices.length + ' 个英文语音，使用本地离线朗读。';
  }
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speakLocal(text, done){
  const u = new SpeechSynthesisUtterance(text);
  const idx = $('voice').value;
  if (idx !== '' && voices[idx]) u.voice = voices[idx];
  u.lang = 'en-US'; u.rate = parseFloat($('rate').value);
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function splitChunks(text, max){
  const first = []; let cur = '';
  text.split(/(?<=[.;:!?])\s+|(?<=,)\s+/).forEach(seg => {
    if ((cur + ' ' + seg).trim().length > max && cur){ first.push(cur.trim()); cur = seg; }
    else cur = (cur ? cur + ' ' : '') + seg;
  });
  if (cur.trim()) first.push(cur.trim());
  const res = [];
  first.forEach(c => {
    if (c.length <= max){ res.push(c); return; }
    let buf = '';
    c.split(/\s+/).forEach(w => {
      if ((buf + ' ' + w).length > max && buf){ res.push(buf); buf = w; } else buf = buf ? buf + ' ' + w : w;
    });
    if (buf) res.push(buf);
  });
  return res;
}
function speakOnline(text, done){
  const mk = eng[$('engine').value] || eng.youdao;
  const arr = splitChunks(text, 170);
  let k = 0, fail = 0;
  (function next(){
    if (stopFlag || k >= arr.length) return done();
    if (audioEl) audioEl.pause();
    audioEl = new Audio(mk(arr[k])); k++;
    audioEl.onended = next;
    audioEl.onerror = () => { if (++fail >= 2) return done(); next(); };
    audioEl.play().catch(() => next());
  })();
}
function speak(text, done){
  if ($('engine').value === 'local' && voices.length) speakLocal(text, done);
  else speakOnline(text, done);
}

/* ---------- 生词本 ---------- */
const VKEY = 'yuedu_vocab';
let vocab = [];
try { vocab = JSON.parse(localStorage.getItem(VKEY) || '[]'); } catch(e){ vocab = []; }
function renderVocab(){
  $('vocabH').textContent = '⭐ 生词本（' + vocab.length + '）';
  const ul = $('vocab');
  ul.innerHTML = '';
  vocab.forEach((w, i) => {
    const li = document.createElement('li');
    const a = document.createElement('span');
    a.className = 'vw'; a.textContent = w;
    a.onclick = () => showWord(w, w);
    const b = document.createElement('span');
    b.className = 'del'; b.textContent = '×';
    b.onclick = () => { vocab.splice(i, 1); saveVocab(); };
    li.appendChild(a); li.appendChild(b); ul.appendChild(li);
  });
}
function saveVocab(){
  localStorage.setItem(VKEY, JSON.stringify(vocab));
  renderVocab();
}
renderVocab();

/* ---------- 词面板 ---------- */
function renderSentence(i){
  curRow = i;
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if (row) row.classList.add('active');
  const d = DATA[i];
  $('sent').innerHTML = '<b>句 ' + (i+1) + '</b>（Part ' + d.part + '）· ' + esc(d.en);
  const box = $('chips');
  box.innerHTML = '';
  (d.tok || []).forEach(p => {
    const t = p[0], k = p[1];
    if (/^\s+$/.test(t)){
      const sp = document.createElement('span'); sp.innerHTML = '&nbsp;'; box.appendChild(sp); return;
    }
    if (!/^[A-Za-z]/.test(t)){
      const sp = document.createElement('span'); sp.className = 'punct'; sp.textContent = t; box.appendChild(sp); return;
    }
    const el = document.createElement('span');
    el.className = 'chip' + (k && BANK[k] ? ' dict' : '');
    el.textContent = t;
    el.onclick = () => {
      box.querySelectorAll('.chip.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      showWord(k, t);
    };
    box.appendChild(el);
  });
  $('card').innerHTML = '<div class="empty">点上面任意单词查看释义。<br>带绿色底线的词，词库已收录。</div>';
}

function showWord(key, surface){
  const e = BANK[key];
  if (!e){
    $('card').innerHTML = '<div class="hd"><span class="word">' + esc(surface || key) + '</span></div>'
      + '<div class="empty">词库暂未收录这个词。</div>';
    return;
  }
  let html = '<div class="hd"><span class="word">' + esc(e.w) + '</span>'
           + (e.ph ? '<span class="phn">/' + esc(e.ph) + '/</span>' : '')
           + (e.lv ? '<span class="badge lv">' + esc(e.lv) + '</span>' : '')
           + '<button id="speakW">🔊 朗读</button><button id="starW">⭐</button></div>';
  if (e.defs && e.defs.length)
    html += '<div class="sub">释义</div><ul class="defs">' + e.defs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (e.forms && e.forms.length)
    html += '<div class="forms">词形变化：' + esc(e.forms.join(' ｜ ')) + '</div>';
  if (e.ex && e.ex.length){
    html += '<div class="sub">真实例句（点句朗读）</div>';
    html += e.ex.map(p => '<div class="ex" data-s="' + esc(p[0]) + '">' + esc(p[0])
             + '<div class="cnx">' + esc(p[1]) + '</div></div>').join('');
  }
  $('card').innerHTML = html;
  $('speakW').onclick = () => speak(e.w, () => {});
  const sw = $('starW');
  const sync = () => {
    const on = vocab.indexOf(e.w) >= 0;
    sw.textContent = on ? '★ 已收藏' : '⭐ 收藏';
    sw.className = on ? 'on' : '';
  };
  sw.onclick = () => {
    const i = vocab.indexOf(e.w);
    if (i >= 0) vocab.splice(i, 1); else vocab.push(e.w);
    saveVocab(); sync();
  };
  sync();
  $('card').querySelectorAll('.ex').forEach(el => {
    el.onclick = () => speak(el.dataset.s, () => {});
  });
}

/* ---------- 播放控制 ---------- */
function clearHL(){ document.querySelectorAll('.row.playing').forEach(r => r.classList.remove('playing')); }
function highlight(i){
  clearHL();
  const el = document.querySelector('.row[data-i="' + i + '"]');
  if (el){ el.classList.add('playing'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function cancelAll(){
  stopFlag = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
async function playFrom(start){
  stopFlag = false;
  for (let i = start; i < DATA.length; i++){
    if (stopFlag) break;
    highlight(i); renderSentence(i);
    await new Promise(res => speak(DATA[i].en, res));
    if (stopFlag) break;
    await new Promise(res => setTimeout(res, +$('gap').value));
  }
  clearHL();
}
$('list').addEventListener('click', ev => {
  const row = ev.target.closest('.row');
  if (!row) return;
  cancelAll(); stopFlag = false;
  const i = +row.dataset.i;
  highlight(i); renderSentence(i);
  speak(DATA[i].en, () => {});
});
$('playAll').onclick = () => { cancelAll(); playFrom(0); };
$('stop').onclick = () => { cancelAll(); clearHL(); };
$('toggleCn').onclick = function(){
  document.body.classList.toggle('show-cn');
  this.classList.toggle('on');
  this.textContent = document.body.classList.contains('show-cn') ? '隐藏中文' : '显示中文';
};
$('rate').oninput = () => $('rateVal').textContent = $('rate').value + 'x';
$('gap').oninput = () => $('gapVal').textContent = ($('gap').value / 1000).toFixed(1) + 's';
$('engine').onchange = function(){
  if (this.value === 'local' && !voices.length){
    this.value = 'youdao';
    $('status').textContent = '本机没有英文语音包，无法使用本地模式。';
  } else {
    $('status').textContent = this.value === 'local'
      ? '已切换到本地离线朗读。' : '已切换到' + this.options[this.selectedIndex].text + '（需要联网）。';
  }
};
</script>
