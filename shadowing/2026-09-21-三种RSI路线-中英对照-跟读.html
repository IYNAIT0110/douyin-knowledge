ight, does the third thing available to any outsider: it writes the exam. Look at the three announcements side by side and they stop looking like three answers to one question; they look like three questions each company can already answer.", "cn": "这一段里藏着一个模式，值得单独命名，因为它每年都会重演。这个行业里没有人是在抽象意义上诚实地定义目标的；大家都是朝着自家资产负债表能支撑的方向去定义。谷歌缺的是顶尖研究员，有的是算力，于是 RSI 变成\"在线强化学习\" —— 一条靠线上流量驱动、靠算力规模而不是靠几个不可替代的人来推动改进的路线。智谱缺的是自主的数据与环境，有的是现金，于是 RSI 变成\"完全自训练\" —— 把流水线整个重做，让数据、任务乃至训练基础设施都由系统自己生成。阶跃星辰暂时赢不了模型竞赛，于是走了任何局外人都能走的第三条路：**自己出题**。把三份公告并排看，它们就不再像\"对同一个问题的三种答案\"，而更像三家公司各自已经会答的那道题。", "tok": [["There", "there"], [" ", ""], ["is", ""], [" ", ""], ["a", "a"], [" ", ""], ["pattern", "pattern"], [" ", ""], ["hiding", "hid"], [" ", ""], ["in", "in"], [" ", ""], ["this", "this"], [" ", ""], ["episode", "episode"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["it", ""], [" ", ""], ["is", ""], [" ", ""], ["worth", "worth"], [" ", ""], ["naming", "nam"], [" ", ""], ["because", "because"], [" ", ""], ["it", ""], [" ", ""], ["will", "will"], [" ", ""], ["repeat", "repeat"], [" ", ""], ["every", ""], [" ", ""], ["year", "year"], [".", ""], [" ", ""], ["Nobody", "nobody"], [" ", ""], ["in", "in"], [" ", ""], ["this", "this"], [" ", ""], ["industry", "industry"], [" ", ""], ["defines", "define"], [" ", ""], ["their", ""], [" ", ""], ["goal", "goal"], [" ", ""], ["honestly", "honest"], [" ", ""], ["in", "in"], [" ", ""], ["the", "the"], [" ", ""], ["abstract", "abstract"], [";", ""], [" ", ""], ["they", ""], [" ", ""], ["define", "define"], [" ", ""], ["it", ""], [" ", ""], ["in", "in"], [" ", ""], ["the", "the"], [" ", ""], ["direction", "direction"], [" ", ""], ["their", ""], [" ", ""], ["own", "own"], [" ", ""], ["balance", "balance"], [" ", ""], ["sheet", "sheet"], [" ", ""], ["can", ""], [" ", ""], ["support", "support"], [".", ""], [" ", ""], ["Google", "google"], [" ", ""], ["is", ""], [" ", ""], ["short", "short"], [" ", ""], ["of", "of"], [" ", ""], ["elite", "elite"], [" ", ""], ["researchers", "researcher"], [" ", ""], ["and", "and"], [" ", ""], ["long", "long"], [" ", ""], ["on", "on"], [" ", ""], ["compute", "compute"], [",", ""], [" ", ""], ["so", "so"], [" ", ""], ["RSI", "rsi"], [" ", ""], ["becomes", "become"], [" ", ""], ["online", "online"], [" ", ""], ["reinforcement", "reinforcement"], [" ", ""], ["learning", "learn"], [" ", ""], ["—", ""], [" ", ""], ["a", "a"], [" ", ""], ["route", "route"], [" ", ""], ["where", ""], [" ", ""], ["the", "the"], [" ", ""], ["model", "model"], [" ", ""], ["learns", "learn"], [" ", ""], ["from", "from"], [" ", ""], ["live", "live"], [" ", ""], ["traffic", "traffic"], [" ", ""], ["and", "and"], [" ", ""], ["the", "the"], [" ", ""], ["improvement", "improvement"], [" ", ""], ["comes", "come"], [" ", ""], ["from", "from"], [" ", ""], ["scale", "scale"], [" ", ""], ["rather", "rather"], [" ", ""], ["than", "than"], [" ", ""], ["from", "from"], [" ", ""], ["a", "a"], [" ", ""], ["handful", "handful"], [" ", ""], ["of", "of"], [" ", ""], ["irreplaceable", "irreplaceable"], [" ", ""], ["people", "people"], [".", ""], [" ", ""], ["Zhipu", "zhipu"], [" ", ""], ["is", ""], [" ", ""], ["short", "short"], [" ", ""], ["of", "of"], [" ", ""], ["autonomous", "autonomous"], [" ", ""], ["data", "data"], [" ", ""], ["and", "and"], [" ", ""], ["environments", "environment"], [" ", ""], ["and", "and"], [" ", ""], ["long", "long"], [" ", ""], ["on", "on"], [" ", ""], ["cash", "cash"], [",", ""], [" ", ""], ["so", "so"], [" ", ""], ["RSI", "rsi"], [" ", ""], ["becomes", "become"], [" ", ""], ["fully", "ful"], [" ", ""], ["self-training", "self-train"], [" ", ""], ["—", ""], [" ", ""], ["rebuild", "rebuild"], [" ", ""], ["the", "the"], [" ", ""], ["pipeline", "pipeline"], [" ", ""], ["so", "so"], [" ", ""], ["that", "that"], [" ", ""], ["data", "data"], [",", ""], [" ", ""], ["tasks", "task"], [" ", ""], ["and", "and"], [" ", ""], ["even", "even"], [" ", ""], ["the", "the"], [" ", ""], ["training", "train"], [" ", ""], ["infrastru ic, and every Flash release is another cohort of users producing real feedback for free. The bet is that if this loop works, intelligence stops being gated by how many world-class researchers you can retain, and becomes gated by how much compute you can point at it — which flips Google's weakness into its strength. Read it uncharitably and it is a company shipping point releases while its rivals ship frontier models. Both readings fit the same facts, which is the useful thing about having them both in your head. The test is simple enough: whichever flagship comes after these Flash releases will tell you whether online RL was the plan or the excuse.", "cn": "善意地解读谷歌这个夏天，是说得通的。六周三个 Flash 模型、旗舰产品缺席，看起来像乏力，直到你注意到每一次发布到底在测什么。在线强化学习没有真实流量就没有价值，而每发布一个 Flash，就等于多一批用户在免费制造真实反馈。赌的是：如果这个循环跑通，智能的上限就不再取决于你能留住多少世界级研究员，而取决于你能投入多少算力 —— 这就把谷歌的弱点翻转成了优势。恶意地解读，这就是一家公司一边发布小版本迭代、一边看着对手发布前沿模型。两种解读都能对上同一批事实，而这正是两种都要留在脑子里的价值所在。检验方法很简单：这几个 Flash 之后的那款旗舰，会告诉你在线强化学习到底是计划，还是借口。", "tok": [["Read", "read"], [" ", ""], ["Google's", "google'"], [" ", ""], ["summer", "summer"], [" ", ""], ["charitably", "charitab"], [" ", ""], ["and", "and"], [" ", ""], ["it", ""], [" ", ""], ["makes", "make"], [" ", ""], ["sense", "sense"], [".", ""], [" ", ""], ["Six", "six"], [" ", ""], ["weeks", "week"], [",", ""], [" ", ""], ["three", "three"], [" ", ""], ["Flash", "flash"], [" ", ""], ["models", "model"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["no", "no"], [" ", ""], ["flagship", "flagship"], [" ", ""], ["launch", "launch"], [" ", ""], ["looks", "look"], [" ", ""], ["like", "like"], [" ", ""], ["weakness", "weakness"], [" ", ""], ["until", "until"], [" ", ""], ["you", ""], [" ", ""], ["notice", "notice"], [" ", ""], ["what", "what"], [" ", ""], ["each", ""], [" ", ""], ["release", "release"], [" ", ""], ["actually", "actual"], [" ", ""], ["tests", "test"], [".", ""], [" ", ""], ["Online", "online"], [" ", ""], ["reinforcement", "reinforcement"], [" ", ""], ["learning", "learn"], [" ", ""], ["is", "" function loadVoices(){
  const sel = $('voice');
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  sel.innerHTML = '<option value="">默认语音</option>'
    + voices.map((v,i) => '<option value="' + i + '">' + esc(v.name) + '</option>').join('');
  if (!voices.length){
    $('engine').value = 'youdao';
    $('status').innerHTML = '本机没有检测到英文语音包，已自动切到<b>在线·有道</b>（需要联网）。';
  } else {
    $('status').textContent = '检测到 ' + voices.length + ' 个英文语音，使用本地离线朗读。';
  }
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speakLocal(text, done){
  const u = new SpeechSynthesisUtterance(text);
  const idx = $('voice').value;
  if (idx !== '' && voices[idx]) u.voice = voices[idx];
  u.lang = 'en-US'; u.rate = parseFloat($('rate').value);
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function splitChunks(text, max){
  const first = []; let cur = '';
  text.split(/(?<=[.;:!?])\s+|(?<=,)\s+/).forEach(seg => {
    if ((cur + ' ' + seg).trim().length > max && cur){ first.push(cur.trim()); cur = seg; }
    else cur = (cur ? cur + ' ' : '') + seg;
  });
  if (cur.trim()) first.push(cur.trim());
  const res = [];
  first.forEach(c => {
    if (c.length <= max){ res.push(c); return; }
    let buf = '';
    c.split(/\s+/).forEach(w => {
      if ((buf + ' ' + w).length > max && buf){ res.push(buf); buf = w; } else buf = buf ? buf + ' ' + w : w;
    });
    if (buf) res.push(buf);
  });
  return res;
}
function speakOnline(text, done){
  const mk = eng[$('engine').value] || eng.youdao;
  const arr = splitChunks(text, 170);
  let k = 0, fail = 0;
  (function next(){
    if (stopFlag || k >= arr.length) return done();
    if (audioEl) audioEl.pause();
    audioEl = new Audio(mk(arr[k])); k++;
    audioEl.onended = next;
    audioEl.onerror = () => { if (++fail >= 2) return done(); next(); };
    audioEl.play().catch(() => next());
  })();
}
function speak(text, done){
  if ($('engine').value === 'local' && voices.length) speakLocal(text, done);
  else speakOnline(text, done);
}

  const ul = $('vocab');
  ul.innerHTML = '';
  vocab.forEach((w, i) => {
    const li = document.createElement('li');
    const a = document.createElement('span');
    a.className = 'vw'; a.textContent = w;
    a.onclick = () => showWord(w, w);
    const b = document.createElement('span');

    b.onclick = () => { vocab.splice(i, 1); saveVocab(); };
    li.appendChild(a); li.appendChild(b); ul.appendChild(li);
  });
}
function saveVocab(){
  localStorage.setItem(VKEY, JSON.stringify(vocab));
  renderVocab();
}

    el.textContent = t;
    el.onclick = () => {
      box.querySelectorAll('.chip.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      showWord(k, t);
    };
    box.appendChild(el);
  });
  $('card').innerHTML = '<div class="empty">点上面任意单词查看释义。<br>带绿色底线的词，词库已收录。</div>';
}

function showWord(key, surface){
  const e = BANK[key];
  if (!e){
    $('card').innerHTML = '<div class="hd"><span class="word">' + esc(surface || key) + '</span></div>'
      + '<div class="empty">词库暂未收录这个词。</div>';
    return;
  }
  let html = '<div class="hd"><span class="word">' + esc(e.w) + '</span>'
           + (e.ph ? '<span class="phn">/' + esc(e.ph) + '/</span>' : '')
           + (e.lv ? '<span class="badge lv">' + esc(e.lv) + '</span>' : '')
           + '<button id="speakW">🔊 朗读</button><button id="starW">⭐</button></div>';
  if (e.defs && e.defs.length)
    html += '<div class="sub">释义</div><ul class="defs">' + e.defs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (e.forms && e.forms.length)
    html += '<div class="forms">词形变化：' + esc(e.forms.join(' ｜ ')) + '</div>';
  if (e.ex && e.ex.length){
    html += '<div class="sub">真实例句（点句朗读）</div>';
    html += e.ex.map(p => '<div class="ex" data-s="' + esc(p[0]) + '">' + esc(p[0])
             + '<div class="cnx">' + esc(p[1]) + '</div></div>').join('');
  }
  $('card').innerHTML = html;
  $('speakW').onclick = () => speak(e.w, () => {});
  const sw = $('starW');
  const sync = () => {
    const on = vocab.indexOf(e.w) >= 0;
    sw.textContent = on ? '★ 已收藏' : '⭐ 收藏';
    sw.className = on ? 'on' : '';
  };
  sw.onclick = () => {
    const i = vocab.indexOf(e.w);
    if (i >= 0) vocab.splice(i, 1); else vocab.push(e.w);
    saveVocab(); sync();
  };
  sync();
  $('card').querySelectorAll('.ex').forEach(el => {
    el.onclick = () => speak(el.dataset.s, () => {});
  });
}

/* ---------- 播放控制 ---------- */
function clearHL(){ document.querySelectorAll('.row.playing').forEach(r => r.classList.remove('playing')); }
function highlight(i){
  clearHL();
  const el = document.querySelector('.row[data-i="' + i + '"]');
  if (el){ el.classList.add('playing'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function cancelAll(){
  stopFlag = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
async function playFrom(start){
  stopFlag = false;
  for (let i = start; i < DATA.length; i++){
    if (stopFlag) break;
    highlight(i); renderSentence(i);
    await new Promise(res => speak(DATA[i].en, res));
    if (stopFlag) break;
    await new Promise(res => setTimeout(res, +$('gap').value));
  }
  clearHL();
}
$('list').addEventListener('click', ev => {
  const row = ev.target.closest('.row');
  if (!row) return;
  cancelAll(); stopFlag = false;
  const i = +row.dataset.i;
  highlight(i); renderSentence(i);
  speak(DATA[i].en, () => {});
});
$('playAll').onclick = () => { cancelAll(); playFrom(0); };
$('stop').onclick = () => { cancelAll(); clearHL(); };
$('toggleCn').onclick = function(){
  document.body.classList.toggle('show-cn');
  this.classList.toggle('on');
  this.textContent = document.body.classList.contains('show-cn') ? '隐藏中文' : '显示中文';
};
$('rate').oninput = () => $('rateVal').textContent = $('rate').value + 'x';
$('gap').oninput = () => $('gapVal').textContent = ($('gap').value / 1000).toFixed(1) + 's';
$('engine').onchange = function(){
  if (this.value === 'local' && !voices.length){
    this.value = 'youdao';
    $('status').textContent = '本机没有英文语音包，无法使用本地模式。';
  } else {
    $('status').textContent = this.value === 'local'
      ? '已切换到本地离线朗读。' : '已切换到' + this.options[this.selectedIndex].text + '（需要联网）。';
  }
};
</script>
